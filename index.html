<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberGuard SOC - Enterprise Threat Intelligence Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #050811; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  </style>
</head>
<body class="bg-[#050811] text-slate-100 min-h-screen font-sans flex flex-col">

  <header class="border-b border-slate-800 bg-[#080d1a] sticky top-0 z-40 px-4 lg:px-8 py-3 shadow-xl">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-sky-500/20 border border-sky-500/30 rounded-xl text-sky-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
            CyberGuard <span class="text-sky-400 font-mono text-base">SOC &middot; ThreatRadar</span>
          </h1>
          <p class="text-xs text-slate-400">Surface: Win Server &bull; Win Desktop &bull; SonicWall &bull; Fortinet &bull; Meraki</p>
        </div>
      </div>

      <div class="flex items-center gap-2.5">
        <div id="feedStatusBadge" class="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-xs text-slate-300 flex items-center gap-2">
          <span id="feedStatusDot" class="w-2 h-2 rounded-full bg-amber-400"></span>
          <span id="feedStatusText">Loading baseline...</span>
        </div>
        <button onclick="loadVulnerabilityFeed()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs">
          Refresh
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl w-full mx-auto px-4 lg:px-8 py-5 flex-1 flex flex-col space-y-4">
    <!-- KPIs -->
    <section class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
      <div class="p-3.5 rounded-xl bg-[#0c1322] border border-red-950/80">
        <span class="text-[11px] font-semibold uppercase tracking-wider text-red-400">Critical (9.0+)</span>
        <div class="mt-2 text-2xl font-bold font-mono text-red-500" id="kpiCritical">0</div>
      </div>
      <div class="p-3.5 rounded-xl bg-[#0c1322] border border-orange-950/80">
        <span class="text-[11px] font-semibold uppercase tracking-wider text-orange-400">High (7.0 - 8.9)</span>
        <div class="mt-2 text-2xl font-bold font-mono text-orange-400" id="kpiHigh">0</div>
      </div>
      <div class="p-3.5 rounded-xl bg-[#0c1322] border border-purple-950/80">
        <span class="text-[11px] font-semibold uppercase tracking-wider text-purple-300">CISA KEV Actives</span>
        <div class="mt-2 text-2xl font-bold font-mono text-purple-300" id="kpiKev">0</div>
      </div>
      <div class="p-3.5 rounded-xl bg-[#0c1322] border border-slate-800">
        <span class="text-[11px] font-semibold uppercase tracking-wider text-amber-400">Firewalls</span>
        <div class="mt-2 text-2xl font-bold font-mono text-amber-300" id="kpiFirewalls">0</div>
      </div>
      <div class="p-3.5 rounded-xl bg-[#0c1322] border border-slate-800">
        <span class="text-[11px] font-semibold uppercase tracking-wider text-sky-400">Windows Fleet</span>
        <div class="mt-2 text-2xl font-bold font-mono text-sky-300" id="kpiWindows">0</div>
      </div>
    </section>

    <!-- Filters -->
    <section class="bg-[#0c1322] border border-slate-800 rounded-2xl p-4 space-y-3">
      <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
        <span class="text-slate-400 uppercase font-mono mr-1">Target:</span>
        <button onclick="setPlatformFilter('ALL')" id="plat-ALL" class="plat-btn px-3 py-1.5 rounded-lg bg-sky-600 text-white font-semibold">All Targets</button>
        <button onclick="setPlatformFilter('Windows Server')" id="plat-Windows Server" class="plat-btn px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-slate-300">Windows Server</button>
        <button onclick="setPlatformFilter('Windows Desktop')" id="plat-Windows Desktop" class="plat-btn px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-slate-300">Windows Desktop</button>
        <button onclick="setPlatformFilter('Fortinet')" id="plat-Fortinet" class="plat-btn px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-slate-300">Fortinet</button>
        <button onclick="setPlatformFilter('SonicWall')" id="plat-SonicWall" class="plat-btn px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-slate-300">SonicWall</button>
        <button onclick="setPlatformFilter('Cisco Meraki')" id="plat-Cisco Meraki" class="plat-btn px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-slate-300">Cisco Meraki</button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-12 gap-3 text-xs">
        <div class="md:col-span-6">
          <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Search CVE ID, service, component, keywords..." class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white outline-none focus:border-sky-500">
        </div>
        <div class="md:col-span-3">
          <select id="severitySelect" onchange="applyFilters()" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white outline-none focus:border-sky-500">
            <option value="ALL">All CVSS &ge; 7.0</option>
            <option value="CRITICAL">Critical (9.0 - 10.0)</option>
            <option value="HIGH">High (7.0 - 8.9)</option>
          </select>
        </div>
        <div class="md:col-span-3">
          <button id="kevToggleBtn" onclick="toggleKevFilter()" class="w-full py-2 px-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-300 hover:text-purple-300 font-semibold">
            CISA KEV Only
          </button>
        </div>
      </div>
    </section>

    <!-- Table -->
    <section class="bg-[#0c1322] border border-slate-800 rounded-2xl shadow-xl overflow-hidden flex-1">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="border-b border-slate-800 bg-slate-950 text-slate-400 font-semibold uppercase text-[10px]">
              <th class="py-3 px-4">CVE Identifier</th>
              <th class="py-3 px-3 text-center">Score</th>
              <th class="py-3 px-4">Platform</th>
              <th class="py-3 px-4">Advisory Overview</th>
              <th class="py-3 px-3">Vector</th>
              <th class="py-3 px-3">Adversary Activity</th>
            </tr>
          </thead>
          <tbody id="cveTableBody" class="divide-y divide-slate-800/60 font-sans">
            <!-- Rows dynamically injected -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const FALLBACK_CVE_DATABASE = [
      {
        id: "CVE-2026-81963",
        platform: "Windows Server",
        title: "Windows Update Stack EoP Zero-Day",
        score: 7.8,
        severity: "HIGH",
        vector: "LOCAL",
        published: "2026-09-08",
        cisaKev: true,
        description: "Improper link resolution (CWE-59) in Windows Update Stack allows authenticated local attackers to redirect file operations and escalate privileges to NT AUTHORITY\\SYSTEM.",
        source: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-81963"
      },
      {
        id: "CVE-2024-38077",
        platform: "Windows Server",
        title: "Windows Remote Desktop Licensing Service RCE (MadLicence)",
        score: 9.8,
        severity: "CRITICAL",
        vector: "NETWORK",
        published: "2024-07-09",
        cisaKev: true,
        description: "Unauthenticated remote code execution vulnerability in Windows Remote Desktop Licensing Service via crafted RPC packets to port 135.",
        source: "https://nvd.nist.gov/vuln/detail/CVE-2024-38077"
      },
      {
        id: "CVE-2024-38063",
        platform: "Windows Server",
        title: "Windows TCP/IP IPv6 Remote Code Execution",
        score: 9.8,
        severity: "CRITICAL",
        vector: "NETWORK",
        published: "2024-08-13",
        cisaKev: false,
        description: "Integer underflow vulnerability in the Windows TCP/IP networking driver (tcpip.sys) allowing remote kernel code execution.",
        source: "https://nvd.nist.gov/vuln/detail/CVE-2024-38063"
      },
      {
        id: "CVE-2020-1472",
        platform: "Windows Server",
        title: "Zerologon: Netlogon Elevation of Privilege",
        score: 10.0,
        severity: "CRITICAL",
        vector: "NETWORK",
        published: "2020-08-17",
        cisaKev: true,
        description: "Unauthenticated elevation of privilege in Netlogon secure channel connection protocols allowing attackers to reset Domain Controller machine passwords.",
        source: "https://nvd.nist.gov/vuln/detail/CVE-2020-1472"
      },
      {
        id: "CVE-2024-43461",
        platform: "Windows Desktop",
        title: "Windows MSHTML Platform Remote Code Execution (Void Banshee)",
        score: 8.8,
        severity: "HIGH",
        vector: "NETWORK",
        published: "2024-09-10",
        cisaKev: true,
        description: "Exploited in the wild to bypass Mark-of-the-Web via crafted filenames and hidden HTA files.",
        source: "https://nvd.nist.gov/vuln/detail/CVE-2024-43461"
      },
      {
        id: "CVE-2024-21762",
        platform: "Fortinet",
        title: "FortiOS & FortiProxy Out-of-Bounds Write RCE in SSL-VPN",
        score: 9.8,
        severity: "CRITICAL",
        vector: "NETWORK",
        published: "2024-02-09",
        cisaKev: true,
        description: "Out-of-bounds write in FortiOS SSL-VPN allows remote unauthenticated code execution via specially crafted HTTP requests.",
        source: "https://nvd.nist.gov/vuln/detail/CVE-2024-21762"
      },
      {
        id: "CVE-2024-40766",
        platform: "SonicWall",
        title: "SonicWall SonicOS Improper Access Control in SSL-VPN",
        score: 9.3,
        severity: "CRITICAL",
        vector: "NETWORK",
        published: "2024-08-22",
        cisaKev: true,
        description: "Improper access control in SonicOS management interface and SSL-VPN functionality exploited in Akira ransomware operations.",
        source: "https://nvd.nist.gov/vuln/detail/CVE-2024-40766"
      },
      {
        id: "CVE-2024-20356",
        platform: "Cisco Meraki",
        title: "Cisco Meraki MX Command Injection Vulnerability",
        score: 9.9,
        severity: "CRITICAL",
        vector: "NETWORK",
        published: "2024-04-24",
        cisaKev: true,
        description: "Command injection vulnerability in web-based management UI allowing unauthenticated attackers to execute root commands.",
        source: "https://nvd.nist.gov/vuln/detail/CVE-2024-20356"
      }
    ];

    let cveDataset = [...FALLBACK_CVE_DATABASE];
    let filteredCves = [];
    let selectedPlatform = "ALL";
    let filterKevOnly = false;

    async function loadVulnerabilityFeed() {
      const dot = document.getElementById("feedStatusDot");
      const text = document.getElementById("feedStatusText");

      try {
        const res = await fetch('./data/cves.json?t=' + Date.now());
        if (!res.ok) throw new Error("Feed not found (HTTP " + res.status + ")");
        const data = await res.json();
        const vulns = Array.isArray(data) ? data : (data.vulnerabilities || []);
        if (!vulns.length) throw new Error("No data in feed");

        cveDataset = vulns;
        if (dot && text) {
          dot.className = "w-2 h-2 rounded-full bg-emerald-400";
          text.innerText = "Live Feed (" + vulns.length + " CVEs)";
        }
      } catch (err) {
        console.warn("Using baseline fallback data:", err.message);
        cveDataset = [...FALLBACK_CVE_DATABASE];
        if (dot && text) {
          dot.className = "w-2 h-2 rounded-full bg-amber-400";
          text.innerText = "Baseline Cache (" + cveDataset.length + " CVEs)";
        }
      }

      applyFilters();
    }

    function applyFilters() {
      const search = (document.getElementById("searchInput").value || "").toLowerCase().trim();
      const sevSelect = document.getElementById("severitySelect").value;

      filteredCves = cveDataset.filter(item => {
        if (item.score < 7.0) return false;
        if (selectedPlatform !== "ALL" && item.platform !== selectedPlatform) return false;
        if (sevSelect === "CRITICAL" && item.score < 9.0) return false;
        if (sevSelect === "HIGH" && (item.score < 7.0 || item.score >= 9.0)) return false;
        if (filterKevOnly && !item.cisaKev) return false;

        if (search) {
          const matchId = (item.id || "").toLowerCase().includes(search);
          const matchTitle = (item.title || "").toLowerCase().includes(search);
          const matchPlat = (item.platform || "").toLowerCase().includes(search);
          if (!matchId && !matchTitle && !matchPlat) return false;
        }
        return true;
      });

      filteredCves.sort((a, b) => b.score - a.score);
      updateKpis();
      renderTable();
    }

    function setPlatformFilter(plat) {
      selectedPlatform = plat;
      document.querySelectorAll(".plat-btn").forEach(b => {
        b.className = "plat-btn px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-slate-300";
      });
      const activeBtn = document.getElementById("plat-" + plat);
      if (activeBtn) {
        activeBtn.className = "plat-btn px-3 py-1.5 rounded-lg bg-sky-600 text-white font-semibold";
      }
      applyFilters();
    }

    function toggleKevFilter() {
      filterKevOnly = !filterKevOnly;
      const btn = document.getElementById("kevToggleBtn");
      btn.className = filterKevOnly 
        ? "w-full py-2 px-3 rounded-xl bg-purple-600 text-white font-semibold"
        : "w-full py-2 px-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-300";
      applyFilters();
    }

    function updateKpis() {
      document.getElementById("kpiCritical").innerText = filteredCves.filter(x => x.score >= 9.0).length;
      document.getElementById("kpiHigh").innerText = filteredCves.filter(x => x.score >= 7.0 && x.score < 9.0).length;
      document.getElementById("kpiKev").innerText = filteredCves.filter(x => x.cisaKev).length;
      document.getElementById("kpiFirewalls").innerText = filteredCves.filter(x => ["Fortinet", "SonicWall", "Cisco Meraki"].includes(x.platform)).length;
      document.getElementById("kpiWindows").innerText = filteredCves.filter(x => ["Windows Server", "Windows Desktop"].includes(x.platform)).length;
    }

    function renderTable() {
      const tbody = document.getElementById("cveTableBody");
      tbody.innerHTML = "";

      if (filteredCves.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-400">No CVEs match your filter criteria.</td></tr>`;
        return;
      }

      filteredCves.forEach(cve => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-800/40 transition border-b border-slate-800/40";

        const isCrit = cve.score >= 9.0;
        const badgeColor = isCrit ? "bg-red-500/10 text-red-400 border border-red-500/30" : "bg-orange-500/10 text-orange-400 border border-orange-500/30";

        tr.innerHTML = `
          <td class="py-3 px-4 font-mono font-bold text-sky-400 whitespace-nowrap">
            <a href="${cve.source || 'https://nvd.nist.gov/vuln/detail/' + cve.id}" target="_blank" class="hover:underline">${cve.id}</a>
            <div class="text-[10px] text-slate-400 font-sans">${cve.published || ''}</div>
          </td>
          <td class="py-3 px-3 text-center whitespace-nowrap">
            <span class="px-2 py-0.5 rounded-full font-mono text-xs font-bold ${badgeColor}">
              ${cve.score ? cve.score.toFixed(1) : '7.0+'}
            </span>
          </td>
          <td class="py-3 px-4 whitespace-nowrap">
            <span class="px-2 py-0.5 rounded text-[11px] font-semibold bg-slate-800 text-slate-200 border border-slate-700">
              ${cve.platform}
            </span>
          </td>
          <td class="py-3 px-4">
            <div class="font-semibold text-slate-100">${cve.title}</div>
            <div class="text-slate-400 text-[11px] line-clamp-1">${cve.description}</div>
          </td>
          <td class="py-3 px-3 whitespace-nowrap font-mono text-slate-300 text-[11px]">
            ${cve.vector || 'NETWORK'}
          </td>
          <td class="py-3 px-3 whitespace-nowrap">
            ${cve.cisaKev 
              ? `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-purple-500/20 text-purple-300 border border-purple-500/30">CISA KEV</span>`
              : `<span class="px-2 py-0.5 rounded text-[10px] text-slate-400 bg-slate-800 border border-slate-700">Monitored</span>`
            }
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Initialize immediately without waiting for complex event chains
    loadVulnerabilityFeed();
  </script>
</body>
</html>
